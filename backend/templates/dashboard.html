<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script>
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const redirects = {
            'admin': '/admin',
            'sales': '/sales',
            'inventory': '/stock',
            'accounts': '/accountant'
        };
        window.location.href = redirects[user.role] || '/login';
    </script>
</head>

    <p>Redirecting...</p>
</body>

</html>
